name: Android quality gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run unit tests, lint, and release builds
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - name: Verify release privacy boundary
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if apkanalyzer manifest permissions "$APK" | grep -Fxq "android.permission.INTERNET"; then
            echo "Release APK unexpectedly contains INTERNET permission."
            exit 1
          fi
          if unzip -Z1 "$APK" | grep -Eiq "qa-private|korean-label|ocr-benchmark|local\.properties"; then
            echo "Release APK unexpectedly contains private QA or local configuration data."
            exit 1
          fi
